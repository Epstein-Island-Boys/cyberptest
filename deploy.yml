name: Deploy to Deno Deploy

on:
  push:
    branches:
      - main # Change this if your default branch is different (e.g., 'master')

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "cyberptest" # Replace with your project name from Deno Deploy
          entrypoint: "main.ts" # Replace with your actual entry point file
